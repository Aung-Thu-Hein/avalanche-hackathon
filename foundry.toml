[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# REQUIRED FOR AVALANCHE.
# Solidity 0.8.30+ defaults to the "prague"/Pectra EVM, which uses opcodes
# Avalanche does not support yet. Without this line your contract may fail to
# deploy or behave strangely on Fuji. Do not remove it.
evm_version = "cancun"

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"

[etherscan]
fuji = { key = "${SNOWTRACE_API_KEY}", chain = 43113, url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan" }
